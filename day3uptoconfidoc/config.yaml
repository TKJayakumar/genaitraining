
chunking:
  chunk_size: 1000
  chunk_overlap: 200

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

results:
  top: 3

storage:
  persist_dir: "./chroma_db"
  collection_name: "binance_incident"
  reset_collection: true

retrieval:
  search_type: "similarity"
  bm25_weight: 0.5
  vector_weight: 0.5
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

pii:
  language: "en"
  entities:
    - "PERSON"
    - "EMAIL_ADDRESS"
    - "PHONE_NUMBER"
  score_threshold: 0.35

llm:
  model: "gemini-3.1-flash-lite"
  temperature: 0

langfuse:
  session_id: "binance_session_1"
  user_id: "Nalla"
  enabled: true
